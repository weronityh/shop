<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>WEGGEW</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-dark: #000000;
            --bg-card: rgba(14, 14, 14, 0.88);
            --bg-card-hover: rgba(24, 24, 24, 0.94);
            --text-white: #ffffff;
            --text-gray: #8a8a8a;
            --accent: #ffffff;
            --border-dark: rgba(255, 255, 255, 0.1);
            --border-card: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        html, body { height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
        body { font-family: var(--font-main); background: var(--bg-dark); color: var(--text-white); display: flex; flex-direction: column; font-size: 15px; line-height: 1.4; }
        .smoke-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            height: 100lvh;
            min-height: 100vh;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.4s ease;
        }
        body.subtle-smoke .smoke-canvas { opacity: 0.25; }
        .smoke-shade {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background:
                radial-gradient(ellipse 80% 60% at 50% 22%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.12) 42%, rgba(0,0,0,0.5) 72%, rgba(0,0,0,0.88) 100%),
                linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 32%, rgba(0,0,0,0.22) 68%, rgba(0,0,0,0.62) 100%);
        }
        body.catalog-bg::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('zadniufon.jpg') center center / cover no-repeat;
            z-index: 0;
            pointer-events: none;
        }
        .app {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: transparent;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
        .page { display: none; min-height: 100%; flex-direction: column; }
        .page.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* КОТ НА ГЛАВНОЙ */
        .cat-mask { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative; }
        .cat-image {
            width: 100%; height: 100%; object-fit: contain; object-position: center bottom;
            mix-blend-mode: screen; filter: contrast(1.03) saturate(1.05); opacity: 0;
            transform: scale(0.97) translateY(12px); will-change: opacity, transform;
            -webkit-mask-image: radial-gradient(ellipse 86% 80% at 50% 46%, #000 0%, #000 58%, rgba(0,0,0,0.94) 70%, rgba(0,0,0,0.62) 84%, rgba(0,0,0,0.22) 94%, transparent 100%);
            mask-image: radial-gradient(ellipse 86% 80% at 50% 46%, #000 0%, #000 58%, rgba(0,0,0,0.94) 70%, rgba(0,0,0,0.62) 84%, rgba(0,0,0,0.22) 94%, transparent 100%);
            transition: opacity 1.4s ease, transform 1.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cat-mask::after {
            content: ""; position: absolute; left: -6%; right: -6%; bottom: -1px; height: 22%; pointer-events: none; z-index: 3;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.18) 46%, rgba(0,0,0,0.62) 82%, #000 100%);
        }
        .cat-image.loaded { opacity: 1; transform: scale(1.06) translateY(0); }
        .hero-smoke {
            position: absolute; inset: -10%; z-index: 4; pointer-events: none; opacity: .75; filter: blur(18px); mix-blend-mode: screen;
            background:
                radial-gradient(ellipse 26% 15% at 20% 64%, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 45%, transparent 74%),
                radial-gradient(ellipse 22% 13% at 80% 56%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.04) 46%, transparent 74%),
                radial-gradient(ellipse 40% 15% at 50% 88%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 48%, transparent 78%),
                radial-gradient(ellipse 30% 12% at 42% 34%, rgba(255,255,255,0.07) 0%, transparent 72%);
            animation: heroSmokeDrift 13s ease-in-out infinite alternate;
        }
        @keyframes heroSmokeDrift {
            0% { transform: translate3d(-1.4%, 0.8%, 0) scale(1.02); opacity: .5; }
            50% { transform: translate3d(0.4%, -1.4%, 0) scale(1.06); opacity: .85; }
            100% { transform: translate3d(1.6%, -2.2%, 0) scale(1.09); opacity: .68; }
        }
        @media (prefers-reduced-motion: reduce) { .hero-smoke { animation: none; opacity: .55; } }

        /* ЭКРАН 1: ПРИВЕТСТВИЕ */
        #welcomePage {
            justify-content: space-between; align-items: center;
            padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 8px);
            text-align: center; position: relative; overflow: hidden; height: 100%; max-height: 100%; min-height: 100%;
        }
        .welcome-hero { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; z-index: 1; }
        @media (max-height: 700px) {
            #welcomePage { padding-top: calc(env(safe-area-inset-top, 0px) + 4px); }
            .welcome-title { font-size: clamp(24px, 7.2vw, 32px); }
            .welcome-divider { margin: 8px auto; }
            .welcome-subtitle { margin-bottom: 12px; font-size: 11px; line-height: 1.6; }
            .main-btn { padding-top: 13px; padding-bottom: 13px; }
        }
        .welcome-bottom { width: 100%; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; position: relative; z-index: 3; margin-top: auto; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.75) 100%); padding-top: 8px; }
        .welcome-title { font-size: clamp(30px, 8.6vw, 42px); font-weight: 200; letter-spacing: clamp(10px, 3.6vw, 18px); text-transform: uppercase; color: #ededed; line-height: 1; padding-left: clamp(10px, 3.6vw, 18px); text-shadow: 0 2px 24px rgba(0,0,0,0.65); position: relative; z-index: 1; display: flex; flex-wrap: wrap; justify-content: center; gap: 0; }
        .title-char { display: inline-block; opacity: 0; transform: translateY(14px) scale(0.96); filter: blur(6px); animation: charReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: calc(var(--i) * 0.5s); will-change: opacity, transform, filter; }
        @keyframes charReveal { to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
        .welcome-divider { width: 46px; height: 1px; background: rgba(255,255,255,0.38); margin: clamp(12px, 2vh, 18px) auto; position: relative; z-index: 1; transform: scaleX(0); transform-origin: center; animation: dividerReveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 3.2s; will-change: transform; }
        @keyframes dividerReveal { to { transform: scaleX(1); } }
        .welcome-subtitle { font-size: clamp(11px, 3.2vw, 13px); font-weight: 300; letter-spacing: clamp(3px, 1.25vw, 5px); line-height: 1.85; color: #cfcfcf; text-transform: uppercase; margin-bottom: clamp(20px, 3.4vh, 32px); position: relative; z-index: 1; }
        .subtitle-line { display: block; opacity: 0; transform: translateY(10px); filter: blur(4px); animation: subtitleReveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; will-change: opacity, transform, filter; }
        .subtitle-line:first-child { animation-delay: 3.3s; }
        .subtitle-line:last-child { animation-delay: 3.5s; }
        @keyframes subtitleReveal { to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .welcome-hint { font-size: clamp(11px, 2.8vw, 12px); font-weight: 400; letter-spacing: clamp(1.5px, 0.5vw, 2px); line-height: 1.4; color: #cfcfcf; text-transform: uppercase; margin-bottom: clamp(16px, 2.5vh, 22px); position: relative; z-index: 1; opacity: 0; transform: translateY(8px); filter: blur(4px); animation: hintReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: 3.9s; will-change: opacity, transform, filter; }
        @keyframes hintReveal { to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .main-btn { width: 100%; max-width: 100%; padding: clamp(16px, 2.6vh, 20px) 24px; border: 1px solid rgba(255,255,255,0.4); border-radius: 40px; background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--text-white); font-size: clamp(11px, 3.1vw, 13px); font-weight: 500; letter-spacing: clamp(2px, 0.8vw, 3px); text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; position: relative; z-index: 1; transition: all 0.2s ease; }
        .main-btn:active { background: var(--accent); color: var(--bg-dark); }

        /* ЭКРАН 3: КАТАЛОГ */
        #catalogPage { padding: 20px 16px 100px; }
        .catalog-header { margin-bottom: 20px; }
        .catalog-title { font-size: 26px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
        .search-bar { display: flex; align-items: center; gap: 10px; background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 12px 16px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
        .search-bar input { background: transparent; border: none; outline: none; color: var(--text-white); font-size: 14px; width: 100%; font-family: inherit; }
        .search-bar input::placeholder { color: var(--text-gray); }
        .search-bar svg { width: 20px; height: 20px; stroke: var(--text-gray); flex-shrink: 0; }
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .category-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; cursor: pointer; transition: background 0.2s; text-align: center; position: relative; z-index: 1; box-shadow: var(--shadow-card); }
        .category-card:active { background: var(--bg-card-hover); }
        .category-card-image { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 48px; }
        .category-card-image img { width: 100%; height: 100%; object-fit: contain; }
        .category-card-title { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .category-card-sub { font-size: 12px; color: var(--text-gray); }

        /* НИЖНЯЯ НАВИГАЦИЯ */
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border-card); display: flex; justify-content: space-around; align-items: center; height: calc(68px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); z-index: 100; box-shadow: var(--shadow-card); }
        .nav-btn { position: relative; background: none; border: none; color: var(--text-gray); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 8px 10px; font-family: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
        .nav-btn.active { color: var(--text-white); }
        .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }

        /* СТРАНИЦА БРЕНДА */
        .sub-header { display: flex; align-items: center; gap: 12px; padding: 16px; margin-bottom: 16px; background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-card); position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow-card); }
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-white); box-shadow: var(--shadow-card); }
        .sub-title { font-size: 18px; font-weight: 600; }
        .product-list { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 100px; }
        .product-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 14px; display: flex; gap: 14px; align-items: center; cursor: pointer; transition: background 0.2s; position: relative; z-index: 1; box-shadow: var(--shadow-card); }
        .product-card:active { background: var(--bg-card-hover); }
        .product-thumb { width: 80px; height: 80px; border-radius: 14px; background: var(--border-card); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-card); }
        .product-thumb img { width: 100%; height: 100%; object-fit: contain; }
        .product-thumb img.full-cover { object-fit: cover; transform: scale(1.25); }
        .product-info { flex: 1; min-width: 0; }
        .product-title { font-size: 15px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .product-desc { font-size: 12px; color: var(--text-gray); margin-bottom: 6px; line-height: 1.3; }
        .product-price { font-size: 16px; font-weight: 700; color: var(--text-white); }
        .promo-badge { display: inline-block; background: #ff9800; color: #000; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 8px; text-transform: uppercase; }
        .add-to-cart-btn { margin-left: auto; padding: 8px 14px; background: var(--text-white); color: var(--bg-dark); border: none; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; flex-shrink: 0; transition: background 0.2s, transform 0.1s; }
        .add-to-cart-btn:active { background: #e0e0e0; transform: scale(0.98); }

        /* АККОРДЕОН БРЕНДОВ */
        .brand-group { display: flex; flex-direction: column; gap: 8px; }
        .brand-group-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.2s, border-color 0.2s; box-shadow: var(--shadow-card); }
        .brand-group-card:active { background: var(--bg-card-hover); }
        .brand-group-card.open { border-color: var(--text-white); }
        .brand-group-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .brand-group-arrow { font-size: 18px; color: var(--text-gray); transition: transform 0.2s; }
        .brand-group-card.open .brand-group-arrow { transform: rotate(90deg); color: var(--text-white); }
        .brand-models-list { display: none; flex-direction: column; gap: 8px; padding-left: 12px; }
        .brand-models-list.open { display: flex; }

        /* БРЕНДЫ СПИСОК */
        .brand-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: background 0.2s, border-color 0.2s; box-shadow: var(--shadow-card); }
        .brand-card:active { background: var(--bg-card-hover); }
        .brand-card-thumb { width: 56px; height: 56px; border-radius: 12px; background: var(--border-card); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border-card); }
        .brand-card-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .brand-card-info { flex: 1; min-width: 0; }
        .brand-card-name { font-size: 16px; font-weight: 700; text-transform: uppercase; }
        .brand-card-count { font-size: 12px; color: var(--text-gray); margin-top: 2px; }
        .brand-card-arrow { color: var(--text-gray); font-size: 20px; }

        /* СТРАНИЦА ТОВАРА */
        .product-detail-header { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-card); position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow-card); }
        .product-detail-title { font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .product-detail-content { padding: 20px 16px 190px; display: flex; flex-direction: column; align-items: center; }
        .product-detail-image-wrap { width: 100%; max-width: 320px; aspect-ratio: 1; margin-bottom: 20px; border-radius: 24px; overflow: hidden; background: var(--bg-dark); position: relative; }
        .product-detail-image { width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s ease; }
        .product-detail-category { font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .product-detail-name { font-size: 22px; font-weight: 900; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
        .product-detail-price { font-size: 20px; font-weight: 700; color: var(--text-white); margin-bottom: 4px; }
        .product-detail-desc { font-size: 14px; color: var(--text-gray); text-align: center; margin-bottom: 24px; line-height: 1.4; }

        .color-selector { width: 100%; max-width: 360px; margin-bottom: 20px; }
        .color-selector-label { font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .color-selector-label span, .color-selector-label b { color: var(--text-white); font-weight: 600; }
        .color-thumbs { display: flex; gap: 10px; overflow-x: auto; padding: 4px 4px 8px; scrollbar-width: none; }
        .color-thumbs::-webkit-scrollbar { display: none; }
        .color-thumb { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex-shrink: 0; border: 2px solid transparent; cursor: pointer; transition: border-color 0.2s, transform 0.1s; background: var(--border-card); position: relative; }
        .color-thumb:active { transform: scale(0.95); }
        .color-thumb.selected { border-color: var(--text-white); }
        .color-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .color-thumb-name { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px; font-size: 9px; text-align: center; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.8)); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .product-detail-footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, var(--bg-dark) 30%, var(--bg-dark)); z-index: 50; }
        .purchase-panel { max-width: 640px; margin: 0 auto; background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow-card); }
        .quantity-selector { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
        .quantity-selector-label { font-size: 12px; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.5px; min-width: 60px; }
        .quantity-control { display: flex; align-items: center; gap: 0; background: var(--bg-dark); border: 1px solid var(--border-card); border-radius: 14px; overflow: hidden; }
        .qty-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-white); font-size: 20px; font-weight: 700; cursor: pointer; transition: background 0.1s; }
        .qty-btn:active { background: rgba(255,255,255,0.1); }
        .qty-value { min-width: 48px; text-align: center; font-size: 18px; font-weight: 700; color: var(--text-white); }
        .add-to-cart-main { width: 100%; height: 56px; background: var(--text-white); color: var(--bg-dark); border: none; border-radius: 16px; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; transition: background 0.1s, transform 0.1s; }
        .add-to-cart-main:active { background: #e0e0e0; transform: scale(0.98); }

        /* КОРЗИНА, ПРОФИЛЬ, АДМИНКА */
        #cartPage, #profilePage, #adminPage { padding: 20px 16px 100px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-gray); }
        .section-title { font-size: 22px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text-white); color: var(--bg-dark); padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 1000; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ПРОФИЛЬ */
        .profile-cards { display: flex; flex-direction: column; gap: 12px; }
        .profile-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow-card); }
        .profile-user { display: flex; align-items: center; gap: 14px; }
        .profile-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
        .profile-username { font-size: 17px; font-weight: 700; }

    <script>
        const ADMIN_USERNAME = 'seregablatnou';

        const firebaseConfig = {
            apiKey: "AIzaSyCjs05afH0dhwWRYs9cq15rG9mi8fdZHfM",
            authDomain: "shop-d8bba.firebaseapp.com",
            projectId: "shop-d8bba",
            storageBucket: "shop-d8bba.firebasestorage.app",
            messagingSenderId: "938799823220",
            appId: "1:938799823220:web:6e4b0f67c4b66cc176d421"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const categories = [

            { id: 'consumables', name: 'РАСХОДНИКИ', sub: '0 шт.', icon: '🔧', image: 'rashodniki.png' }
        ];

        const catalogData = { vapes: [], snus: [], liquids: [], disposables: [], consumables: [] };
        let allRawProducts = [];
        let vapeBrands = [];
        let liquidBrands = [];
        let cart = [];
        let currentCategoryId = null;
        let currentBrandIdx = null;
        let currentModelIdx = null;

        const VAPE_COLOR_IMAGES = {
            'PASITO 3': {
                'Фиолетовый': 'PASSITO3FIOL.jpg',
                'Белый': 'PASSITO3WITE.jpg',
                'Чёрный': 'PASSITO3BLACK.jpg',

        function getFallbackColorImage(modelName, colorName) {
            const norm = (value) => String(value || '').toUpperCase().replace(/\s+/g, ' ').trim();
            const found = Object.entries(VAPE_COLOR_IMAGES).find(([name]) => norm(name) === norm(modelName));
            if (!found) return null;
            return found[1][colorName] || null;
        }

        const pages = {
            welcome: document.getElementById('welcomePage'),
            catalog: document.getElementById('catalogPage'),
            brand: document.getElementById('brandPage'),
            brandModels: document.getElementById('brandModelsPage'),
            productDetail: document.getElementById('productDetailPage'),
            cart: document.getElementById('cartPage'),
            profile: document.getElementById('profilePage'),
            admin: document.getElementById('adminPage')
        };

        const bottomNav = document.getElementById('bottomNav');
        const categoryGrid = document.getElementById('categoryGrid');
        const brandList = document.getElementById('brandList');
        const brandPageTitle = document.getElementById('brandPageTitle');
        const toast = document.getElementById('toast');
        const cartCountEl = document.getElementById('cartCount');

        function isAdminUser() {
            const uname = window.Telegram?.WebApp?.initDataUnsafe?.user?.username || '';
            return uname.toLowerCase() === ADMIN_USERNAME;
        }

        function showPage(name) {
            Object.values(pages).forEach(p => p.classList.remove('active'));
            pages[name].classList.add('active');
            mainScroll.scrollTop = 0;

            if (name === 'welcome') {
                const catImg = document.getElementById('catImage');
                if (catImg) {
                    catImg.classList.remove('loaded');
                    requestAnimationFrame(() => catImg.classList.add('loaded'));
                }
                restartWelcomeAnimations();
            }

            document.body.classList.toggle('subtle-smoke', name === 'location');
            document.body.classList.toggle('catalog-bg', name === 'catalog');

            if (name === 'catalog' || name === 'cart' || name === 'profile' || name === 'brand' || name === 'admin') {
                bottomNav.style.display = 'flex';
            } else {
                bottomNav.style.display = 'none';
            }

            const tabMap = { catalog: 'catalog', brand: 'catalog', brandModels: 'catalog', productDetail: 'catalog', cart: 'cart', profile: 'profile', admin: 'admin' };
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === (tabMap[name] || ''));
            });
        }

        function restartWelcomeAnimations() {
            const titleChars = document.querySelectorAll('.title-char');
            const divider = document.querySelector('.welcome-divider');
            const subtitleLines = document.querySelectorAll('.subtitle-line');
            const hint = document.querySelector('.welcome-hint');

            [divider, hint, ...subtitleLines, ...titleChars].forEach(el => {
                if (el) {
                    el.style.animation = 'none';
                    el.offsetHeight;
                    el.style.animation = '';
                }
            });
        }

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // --- ПОДПИСКА НА FIREBASE FIRESTORE ---
        function startFirestoreSync() {
            db.collection('products').onSnapshot((snapshot) => {
                const defaultImages = {
                    vapes: 'vape.png',
                    snus: 'snus.png',
                    liquids: 'zhizha.png',
                    disposables: 'odnorazki.png',
                    consumables: 'rashodniki.png'
                };
                const iconMap = { vapes: '📱', snus: '📦', liquids: '💧', disposables: '🚬', consumables: '🔧' };

                allRawProducts = [];
                const newVapeData = [];
                const newLiquidData = [];
                const newData = { vapes: [], snus: [], liquids: [], disposables: [], consumables: [] };

                snapshot.forEach((doc) => {
                    const d = doc.data();
                    allRawProducts.push({ docId: doc.id, ...d });

                    const siteCat = d.category === 'devices' ? 'vapes' : (d.category || 'vapes');
                    const name = (d.name || '').trim();
                    if (!name) return;

                    const price = Number(d.price) || 0;
                    const stock = d.stock !== undefined && d.stock !== '' ? (Number(d.stock) || 0) : 99;
                    const brand = (d.brand || '').trim();
                    const desc = (d.desc || '').trim();
                    const singleColor = (d.color || '').trim();
                    const colorStock = d.color_stock !== undefined && d.color_stock !== '' ? (Number(d.color_stock) || 0) : stock;
                    const rawImage = (d.image || '').trim();

                    if (stock <= 0) return;

                    if (siteCat === 'vapes' && brand) {
                        if (singleColor && colorStock <= 0) return;

                        const resolvedImage = rawImage
                            || (singleColor ? getFallbackColorImage(name, singleColor) : null)
                            || defaultImages.vapes;

                        newVapeData.push({
                            id: doc.id,
                            brand,
                            name,
                            desc,
                            price,
                            stock,
                            colorStock,
                            image: resolvedImage,
                            rawImage,
                            isCover: name.toLowerCase() === 'xros 6 mini',
                            colors: singleColor ? [singleColor] : ['Чёрный']
                        });
                    } else if (siteCat === 'liquids' && brand) {
                        newLiquidData.push({ id: doc.id, brand, name, desc, price, stock });
                    } else if (newData[siteCat]) {
                        newData[siteCat].push({
                            id: doc.id,
                            name,
                            desc,
                            price,
                            stock,
                            image: rawImage || defaultImages[siteCat] || 'vape.png',
                            isCover: name.toLowerCase() === 'xros 6 mini',
                            icon: iconMap[siteCat] || '📦'
                        });
                    }
                });

                const vapeBrandMap = new Map();
                for (const item of newVapeData) {
                    if (!vapeBrandMap.has(item.brand)) {
                        vapeBrandMap.set(item.brand, { brand: item.brand, modelsMap: new Map() });
                    }
                    const brandEntry = vapeBrandMap.get(item.brand);
                    const modelKey = item.name.toLowerCase();

                    if (!brandEntry.modelsMap.has(modelKey)) {
                        brandEntry.modelsMap.set(modelKey, {
                            name: item.name,
                            desc: item.desc || 'Под-система',
                            price: item.price,
                            stock: item.stock,
                            image: item.image,
                            isCover: item.isCover,
                            colors: [],
                            colorImages: {},
                            colorStocks: {}
                        });
                    }

                    const model = brandEntry.modelsMap.get(modelKey);
                    for (const c of item.colors) {
                        if (!model.colors.includes(c)) model.colors.push(c);
                        model.colorImages[c] = item.rawImage || getFallbackColorImage(item.name, c) || item.image;
                        model.colorStocks[c] = item.colorStock;
                    }
                    if (model.image === defaultImages.vapes && item.image !== defaultImages.vapes) {
                        model.image = item.image;
                    }
                }

                vapeBrands = Array.from(vapeBrandMap.values())
                    .map(b => ({ brand: b.brand, models: Array.from(b.modelsMap.values()) }))
                    .filter(b => b.models.length > 0);

                const liquidBrandMap = new Map();
                for (const item of newLiquidData) {
                    if (!liquidBrandMap.has(item.brand)) {
                        liquidBrandMap.set(item.brand, { brand: item.brand, flavors: [] });
                    }
                    liquidBrandMap.get(item.brand).flavors.push({
                        name: item.name,
                        desc: item.desc || '',
                        price: item.price,
                        stock: item.stock
                    });
                }
                liquidBrands = Array.from(liquidBrandMap.values());

                Object.keys(newData).forEach(key => {
                    if (key !== 'vapes' && key !== 'liquids') {
                        catalogData[key] = newData[key];
                    }
                });

                categories[0].sub = `${vapeBrands.length} бренд${vapeBrands.length === 1 ? '' : vapeBrands.length < 5 ? 'а' : 'ов'}`;
                categories[2].sub = `${liquidBrands.length} бренд${liquidBrands.length === 1 ? '' : liquidBrands.length < 5 ? 'а' : 'ов'}`;
                categories[1].sub = `${catalogData.snus.length} шт.`;
                categories[3].sub = `${catalogData.disposables.length} шт.`;
                categories[4].sub = `${catalogData.consumables.length} шт.`;

                renderCategories();
                if (currentCategoryId && pages.brand.classList.contains('active')) {
                    openCategory(currentCategoryId);
                }
                if (pages.admin.classList.contains('active')) {
                    renderAdminList();
                }
            }, (err) => {
                console.error('Ошибка Firestore:', err);
            });
        }

        function renderCategories() {
            categoryGrid.innerHTML = categories.map(cat => {
                let count = 0;
                if (cat.id === 'vapes') count = vapeBrands.length;
                else if (cat.id === 'liquids') count = liquidBrands.length;
                else count = catalogData[cat.id]?.length || 0;
                return `
                <div class="category-card" data-category="${cat.id}">
                    <div class="category-card-image">
                        ${cat.image ? `<img src="${cat.image}" alt="${cat.name}">` : `<span>${cat.icon}</span>`}
                    </div>
                    <div class="category-card-title">${cat.name}</div>
                    <div class="category-card-sub">${(cat.id === 'vapes' || cat.id === 'liquids') ? `${count} бренд${count === 1 ? '' : count < 5 ? 'а' : 'ов'}` : `${count} шт.`}</div>
                </div>
            `}).join('');

            categoryGrid.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', () => openCategory(card.dataset.category));
            });
        }

                brandList.innerHTML = vapeBrands.map((b, bIdx) => {

                brandList.innerHTML = liquidBrands.map((b, bIdx) => `

                            <div class="product-title">${entry.name}</div>
                            <div class="product-desc">${entry.desc || ''}</div>
                            <div class="product-price">${entry.price} BYN</div>

        function openBrandModels(brandIdx) {
            currentBrandIdx = brandIdx;
            const brand = vapeBrands[brandIdx];

            if (brand.models.length === 1) {

                        <div class="product-price">${m.price} BYN</div>
                    </div>

            modelsList.querySelectorAll('.product-card[data-model-idx]').forEach(card => {
                card.addEventListener('click', () => {

        function openProductDetail(brandIdx, modelIdx) {
            currentBrandIdx = brandIdx;
            currentModelIdx = modelIdx;
            const brand = vapeBrands[brandIdx];
            const model = brand?.models[modelIdx];
            if (!model) return;

            const content = document.getElementById('productDetailContent');
            const footer = document.getElementById('productDetailFooter');
            document.getElementById('productDetailTitle').textContent = model.name.toUpperCase();

            let selectedColorIdx = 0;
            const colors = model.colors && model.colors.length > 0 ? model.colors : ['Чёрный'];

            function renderContent() {
                const selectedColor = colors[selectedColorIdx];
                const colorImages = model.colorImages || {};
                const imageSrc = colorImages[selectedColor] || model.image;
                const maxStock = (model.colorStocks && model.colorStocks[selectedColor] !== undefined)
                    ? model.colorStocks[selectedColor]
                    : (model.stock || 99);

                content.innerHTML = `
                    <div class="product-detail-image-wrap">
                        <img class="product-detail-image" id="productMainImage" src="${imageSrc}" alt="${model.name}">
                    </div>
                    <div class="product-detail-category">POD-СИСТЕМЫ</div>
                    <div class="product-detail-name">${model.name}</div>
                    <div class="product-detail-price">${model.price} BYN</div>
                    <div class="product-detail-desc">${model.desc || 'Под-система'}</div>

                    <div class="color-selector">
                        <div class="color-selector-label">
                            <span>ЦВЕТ: <b id="selectedColorName">${selectedColor}</b></span>
                            <span>В наличии: ${maxStock} шт.</span>
                        </div>
                        <div class="color-thumbs" id="colorThumbs">
                            ${colors.map((c, ci) => {
                                const cImg = colorImages[c] || model.image;
                                return `<div class="color-thumb ${ci === selectedColorIdx ? 'selected' : ''}" data-color-idx="${ci}">
                                    <img src="${cImg}" alt="${c}">
                                    <div class="color-thumb-name">${c}</div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;

                footer.innerHTML = `
                    <div class="purchase-panel">
                        <div class="quantity-selector">
                            <span class="quantity-selector-label">КОЛИЧЕСТВО</span>
                            <div class="quantity-control">
                                <button class="qty-btn" id="qtyDecrease">−</button>
                                <span class="qty-value" id="qtyValue">1</span>
                                <button class="qty-btn" id="qtyIncrease">+</button>
                            </div>
                        </div>
                        <button class="add-to-cart-main" id="addToCartMain">В КОРЗИНУ</button>
                    </div>
                `;

                document.querySelectorAll('#colorThumbs .color-thumb').forEach(thumb => {
                    thumb.addEventListener('click', () => {
                        selectedColorIdx = parseInt(thumb.dataset.colorIdx, 10);
                        renderContent();
                    });
                });

                let qty = 1;
                const qtyValue = document.getElementById('qtyValue');
                document.getElementById('qtyDecrease').addEventListener('click', () => {
                    if (qty > 1) {
                        qty--;
                        qtyValue.textContent = qty;
                    }
                });
                document.getElementById('qtyIncrease').addEventListener('click', () => {
                    if (qty < maxStock) {
                        qty++;
                        qtyValue.textContent = qty;
                    } else {
                        showToast(`В наличии только ${maxStock} шт.`);
                    }
                });

                document.getElementById('addToCartMain').addEventListener('click', () => {
                    addToCart({
                        name: model.name,
                        price: model.price,
                        desc: model.desc || 'Под-система',
                        color: selectedColor,
                        image: model.colorImages?.[selectedColor] || model.image,
                        maxStock
                    }, qty);
                });
            }

            renderContent();
            showPage('productDetail');
        }

        function addToCart(product, qty = 1) {
            const count = Math.max(1, parseInt(qty, 10) || 1);
            const maxStock = product.maxStock ?? product.stock ?? Infinity;
            const existing = cart.find(item => item.name === product.name && item.color === product.color);
            const currentQty = existing ? existing.qty : 0;

            if (currentQty + count > maxStock) {
                showToast(`Максимум в наличии: ${maxStock} шт.`);
                return;
            }

            if (existing) {
                existing.qty += count;
            } else {
                cart.push({
                    id: product.id || 'item_' + Date.now(),
                    name: product.name,
                    desc: product.desc || '',
                    price: product.price,
                    qty: count,
                    color: product.color || null,
                    maxStock
                });
            }
            updateCartCount();
            showToast('Добавлено в корзину');
        }

        function updateCartCount() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            if (cartCountEl) {
                cartCountEl.textContent = total;
                cartCountEl.style.display = total > 0 ? 'flex' : 'none';
            }
        }

        function renderCart() {
            const cartPage = document.getElementById('cartPage');
            if (cart.length === 0) {
                cartPage.innerHTML = `<h1 class="section-title">КОРЗИНА</h1><div class="empty-state">Корзина пока пуста</div>`;
                return;
            }
            let total = 0;
            cartPage.innerHTML = `
                <h1 class="section-title">КОРЗИНА</h1>
                <div class="cart-list" style="display:flex; flex-direction:column; gap:12px; padding:0 16px 100px;">
                    ${cart.map(item => {
                        total += item.price * item.qty;
                        return `
                        <div class="cart-item" style="background:var(--bg-card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--border-card); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-card);">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div style="flex:1; min-width:0;">
                                    <div style="font-size:15px; font-weight:700; text-transform:uppercase;">${item.name}</div>
                                    ${item.color ? `<div style="font-size:12px; color:var(--text-gray); margin-top:2px;">Цвет: ${item.color}</div>` : ''}
                                    ${item.desc ? `<div style="font-size:12px; color:var(--text-gray); margin-top:2px;">${item.desc}</div>` : ''}
                                </div>
                                <div style="font-size:16px; font-weight:700; white-space:nowrap;">${item.price * item.qty} BYN</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:8px; border-top:1px solid var(--border-card); padding-top:10px;">
                                <button class="qty-btn" data-id="${item.id}" data-action="decrease" style="width:36px; height:36px; border-radius:50%; background:var(--bg-dark); border:1px solid var(--border-card); color:var(--text-white); font-size:18px; display:flex; align-items:center; justify-content:center;">−</button>
                                <span class="qty-value" style="min-width:24px; text-align:center; font-size:15px; font-weight:600;">${item.qty}</span>
                                <button class="qty-btn" data-id="${item.id}" data-action="increase" style="width:36px; height:36px; border-radius:50%; background:var(--bg-dark); border:1px solid var(--border-card); color:var(--text-white); font-size:18px; display:flex; align-items:center; justify-content:center;">+</button>
                                <button class="remove-btn" data-id="${item.id}" style="margin-left:auto; padding:6px 12px; background:transparent; border:1px solid var(--border-card); border-radius:12px; color:var(--text-gray); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;">Удалить</button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>
                <div style="position:fixed; bottom:calc(68px + env(safe-area-inset-bottom)); left:0; right:0; background:var(--bg-card); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border-card); padding:16px; display:flex; flex-direction:column; gap:12px; z-index:100; box-shadow:var(--shadow-card);">
                    <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:700;">
                        <span>Итого</span>
                        <span id="cartTotal">${total} BYN</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn" style="width:100%; padding:16px 24px; border:none; border-radius:16px; background:var(--text-white); color:var(--bg-dark); font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:1px; cursor:pointer;">ОФОРМИТЬ ЗАКАЗ</button>
                </div>
            `;

            cartPage.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;
                    const item = cart.find(i => i.id === id);
                    if (item) {
                        if (action === 'increase') {
                            if (item.maxStock && item.qty >= item.maxStock) {
                                showToast(`Максимум в наличии: ${item.maxStock} шт.`);
                                return;
                            }
                            item.qty += 1;
                        } else if (action === 'decrease') {
                            item.qty -= 1;
                            if (item.qty <= 0) cart.splice(cart.indexOf(item), 1);
                        }
                        renderCart();
                        updateCartCount();
                    }
                });
            });

            cartPage.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = cart.findIndex(i => i.id === btn.dataset.id);
                    if (idx !== -1) {
                        cart.splice(idx, 1);
                        renderCart();
                        updateCartCount();
                    }
                });
            });

            document.getElementById('checkoutBtn').addEventListener('click', checkout);
        }

            if (cart.length === 0) { showToast('Корзина пуста'); return; }
            showDeliveryModal();
        }

                    <div class="admin-item-info">
                        <div class="admin-item-title">${p.name || 'Без названия'}</div>
                        <div class="admin-item-sub">${p.brand || ''} ${p.color ? '· ' + p.color : ''} · ${p.price || 0} BYN</div>
                    </div>
                    <div class="admin-stock-ctrl">
                        <button class="admin-mini-btn" data-id="${p.docId}" data-is-vape="${isVape && p.color ? '1' : '0'}" data-val="${currentStock}" data-act="dec">−</button>
                        <span style="min-width: 22px; text-align:center; font-size:13px; font-weight:700;">${currentStock}</span>
                        <button class="admin-mini-btn" data-id="${p.docId}" data-is-vape="${isVape && p.color ? '1' : '0'}" data-val="${currentStock}" data-act="inc">+</button>
                        <button class="admin-del-btn" data-id="${p.docId}" data-act="del">🗑</button>
                    </div>
                </div>`;
            }).join('');

            listEl.querySelectorAll('.admin-mini-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.id;
                    const isColorStock = btn.dataset.isVape === '1';
                    const cur = Number(btn.dataset.val) || 0;
                    const next = btn.dataset.act === 'inc' ? cur + 1 : Math.max(0, cur - 1);
                    const field = isColorStock ? { color_stock: next } : { stock: next };
                    await db.collection('products').doc(id).update(field);
                    showToast(`Сток обновлён: ${next}`);
                });
            });

            listEl.querySelectorAll('.admin-del-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await db.collection('products').doc(btn.dataset.id).delete();
                    showToast('Удалено');
                });
            });
        }

        document.getElementById('admPhotoFile').addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            showToast('Загрузка фото...');
            const formData = new FormData();
            formData.append('image', file);
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const json = await res.json();
                if (json.success) {
                    document.getElementById('admImage').value = json.data.url;
                    showToast('Фото загружено!');
                } else {
                    showToast('Ошибка загрузки фото');
                }
            } catch (err) {
                console.error(err);
                showToast('Ошибка сети при загрузке');
            }
        });

        document.getElementById('admSaveBtn').addEventListener('click', async () => {
            const category = document.getElementById('admCategory').value;
            const brand = document.getElementById('admBrand').value.trim();
            const name = document.getElementById('admName').value.trim();
            const desc = document.getElementById('admDesc').value.trim();
            const price = Number(document.getElementById('admPrice').value) || 0;
            const stock = Number(document.getElementById('admStock').value) || 0;
            const color = document.getElementById('admColor').value.trim();
            const colorStockRaw = document.getElementById('admColorStock').value.trim();
            const color_stock = colorStockRaw !== '' ? (Number(colorStockRaw) || 0) : stock;
            const image = document.getElementById('admImage').value.trim();

            if (!name || !price) {
                showToast('Укажите название и цену');
                return;
            }

            try {
                await db.collection('products').add({
                    category, brand, name, desc, price, stock, color, color_stock, image,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('admName').value = '';
                document.getElementById('admDesc').value = '';
                document.getElementById('admColor').value = '';
                document.getElementById('admColorStock').value = '';
                document.getElementById('admImage').value = '';
                document.getElementById('admPhotoFile').value = '';
                showToast('Товар добавлен в базу!');
            } catch (err) {
                console.error(err);
                showToast('Ошибка сохранения в Firebase');
            }
        });

        function showDeliveryModal() {
            const modal = document.createElement('div');
            modal.className = 'delivery-modal';
            modal.style.cssText = `position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.2s ease;`;
            modal.innerHTML = `
                <div style="background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 24px; width: 100%; max-width: 360px; animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: var(--shadow-card);">
                    <h3 style="font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: center;">ВРЕМЯ ПОЛУЧЕНИЯ</h3>
                    <p style="font-size: 13px; color: var(--text-gray); text-align: center; margin-bottom: 20px;">Когда вам удобно забрать заказ?</p>
                    <div class="delivery-options" style="display: flex; flex-direction: column; gap: 10px;">
                        <button class="delivery-option" data-day="today" style="padding: 16px; border-radius: 14px; border: 1px solid var(--border-card); background: var(--bg-card); color: var(--text-white); font-size: 15px; font-weight: 600; text-transform: uppercase; cursor: pointer;">📍 Сегодня</button>
                        <button class="delivery-option" data-day="tomorrow" style="padding: 16px; border-radius: 14px; border: 1px solid var(--border-card); background: var(--bg-card); color: var(--text-white); font-size: 15px; font-weight: 600; text-transform: uppercase; cursor: pointer;">📅 Завтра</button>
                    </div>
                    <div class="time-picker" style="display: none; margin-top: 16px;">
                        <label style="font-size: 12px; color: var(--text-gray); margin-bottom: 8px; display: block; text-transform: uppercase;">Выберите время</label>
                        <select id="deliveryTime" style="width: 100%; padding: 14px 16px; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border-card); color: var(--text-white); font-size: 14px; font-family: inherit;"></select>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            let selectedDay = 'Сегодня';
            const timeSelect = modal.querySelector('#deliveryTime');
            const timeOptions = ['09:00 - 11:00', '11:00 - 13:00', '13:00 - 15:00', '15:00 - 17:00', '17:00 - 19:00', '19:00 - 21:00', '21:00 - 23:00', 'как можно быстрее'];
            const defaultOpt = document.createElement('option');
            defaultOpt.value = ''; defaultOpt.textContent = 'Выберите время...'; defaultOpt.disabled = true; defaultOpt.selected = true;
            timeSelect.appendChild(defaultOpt);
            timeOptions.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t; opt.textContent = t;
                timeSelect.appendChild(opt);
            });

            modal.querySelectorAll('.delivery-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedDay = btn.dataset.day === 'today' ? 'Сегодня' : 'Завтра';
                    modal.querySelector('.delivery-options').style.display = 'none';
                    modal.querySelector('.time-picker').style.display = 'block';
                    modal.querySelector('h3').textContent = selectedDay === 'Сегодня' ? 'ВРЕМЯ НА СЕГОДНЯ' : 'ВРЕМЯ НА ЗАВТРА';
                });
            });

            timeSelect.addEventListener('change', (e) => {
                if (!e.target.value) return;
                sendOrder(selectedDay, e.target.value);
                modal.remove();
            });

            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        function sendOrder(dayLabel, timeLabel) {
            let orderText = 'Здравствуйте! Хочу оформить заказ:\n';
            let total = 0;
            cart.forEach((item, i) => {
                const lineTotal = item.price * item.qty;
                total += lineTotal;
                const colorStr = item.color ? ` (${item.color})` : '';
                orderText += `${i + 1}. ${item.name}${colorStr} × ${item.qty} — ${lineTotal} BYN\n`;
            });
            orderText += `\nИтого: ${total} BYN\n📅 Получение: ${dayLabel}\n⏰ Время: ${timeLabel}`;
            const url = 'https://t.me/Seregablatnou?text=' + encodeURIComponent(orderText);
            if (window.Telegram?.WebApp?.openTelegramLink) window.Telegram.WebApp.openTelegramLink(url);
            else window.open(url, '_blank');
            cart = [];
            updateCartCount();
            renderCart();
            showToast('Заказ сформирован');
        }

        document.getElementById('goToCatalogBtn').addEventListener('click', () => {
            renderCategories();
            showPage('catalog');
        });

        document.getElementById('backToCatalog').addEventListener('click', () => showPage('catalog'));
        document.getElementById('backToBrands').addEventListener('click', () => showPage('brand'));
        document.getElementById('backToModels').addEventListener('click', () => {
            const brand = vapeBrands[currentBrandIdx];
            if (brand && brand.models.length === 1) showPage('brand');
            else showPage('brandModels');
        });

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                if (tab === 'home') showPage('welcome');
                if (tab === 'catalog') showPage('catalog');
                if (tab === 'cart') { showPage('cart'); renderCart(); }
                if (tab === 'profile') { showPage('profile'); renderProfile(); }
                if (tab === 'admin' && isAdminUser()) { showPage('admin'); renderAdminList(); }
            });
        });

        document.getElementById('brandList').addEventListener('click', (e) => {
            const btn = e.target.closest('.add-to-cart-btn');
            if (btn && btn.dataset.product) {
                try { addToCart(JSON.parse(btn.dataset.product)); }
                catch (err) { console.error('Add to cart parse error:', err); }
            }
        });

        (function initSmoke() {
            const canvas = document.getElementById('smokeCanvas');
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext('2d');
            let width = 0, height = 0, dpr = 1, puffs = [];

            const puff = document.createElement('canvas');
            puff.width = puff.height = 256;
            const pctx = puff.getContext('2d');
            const grad = pctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, 'rgba(230,235,240,0.8)');
            grad.addColorStop(0.3, 'rgba(200,210,220,0.4)');
            grad.addColorStop(0.6, 'rgba(170,185,200,0.18)');
            grad.addColorStop(0.85, 'rgba(150,170,185,0.06)');
            grad.addColorStop(1, 'rgba(160,170,180,0)');
            pctx.fillStyle = grad;
            pctx.fillRect(0, 0, 256, 256);

            function getViewportHeight() {
                const vv = window.visualViewport;
                if (vv && vv.height) return vv.height;
                return Math.max(window.innerHeight, document.documentElement.clientHeight, document.body.clientHeight);
            }

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 1.75);
                width = window.innerWidth;
                height = getViewportHeight();
                const rect = canvas.getBoundingClientRect();
                canvas.width = Math.max(1, Math.round(rect.width * dpr));
                canvas.height = Math.max(1, Math.round(rect.height * dpr));
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function createPuffs() {
                const isMobile = width < 480;
                const baseCount = isMobile ? 28 : 42;
                const extraLarge = isMobile ? 6 : 10;
                puffs = [];
                for (let i = 0; i < baseCount; i++) {
                    const r = 65 + Math.random() * 150;
                    puffs.push({ x: Math.random() * width, y: height + r + Math.random() * height * 0.8, r, vx: (Math.random() - 0.5) * 0.2, vy: -0.5 - Math.random() * 0.6, rot: (Math.random() - 0.5) * 1.8, vr: (Math.random() - 0.5) * 0.001, alpha: 0.18 + Math.random() * 0.14, phase: Math.random() * Math.PI * 2, stretch: 1.3 + Math.random() * 1.0 });
                }
                for (let i = 0; i < extraLarge; i++) {
                    const r = 170 + Math.random() * 130;
                    puffs.push({ x: Math.random() * width, y: height + r + Math.random() * height * 0.5, r, vx: (Math.random() - 0.5) * 0.1, vy: -0.3 - Math.random() * 0.4, rot: (Math.random() - 0.5) * 1.0, vr: (Math.random() - 0.5) * 0.0005, alpha: 0.12 + Math.random() * 0.10, phase: Math.random() * Math.PI * 2, stretch: 1.1 + Math.random() * 0.7 });
                }
            }

            let rafId = 0;
            function draw(time) {
                ctx.clearRect(0, 0, width, height);
                ctx.globalCompositeOperation = 'lighter';
                for (const p of puffs) {
                    p.x += p.vx + Math.sin(time / 3200 + p.phase) * 0.22;
                    p.y += p.vy;
                    p.rot += p.vr;
                    if (p.y + p.r * p.stretch < 0) {
                        p.y = height + p.r + Math.random() * height * 0.3;
                        p.x = Math.random() * width;
                    }
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = p.alpha;
                    ctx.drawImage(puff, -p.r, -p.r * p.stretch, p.r * 2, p.r * 2 * p.stretch);
                    ctx.restore();
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                rafId = requestAnimationFrame(draw);
            }

            function scheduleResize() {
                resize();
                createPuffs();
                if (!rafId) rafId = requestAnimationFrame(draw);
            }

            resize();
            createPuffs();
            window.addEventListener('resize', scheduleResize);
            if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);
            if (window.Telegram?.WebApp) {
                try { window.Telegram.WebApp.onEvent('viewportChanged', scheduleResize); } catch (e) {}
            }
            rafId = requestAnimationFrame(draw);
        })();

        if (window.Telegram?.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#000000');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        }

        if (isAdminUser()) {
            document.getElementById('adminNavBtn').style.display = 'flex';
        }

        startFirestoreSync();

        const initialCat = document.getElementById('catImage');
        if (initialCat) {
            if (initialCat.complete) initialCat.classList.add('loaded');
            else initialCat.addEventListener('load', () => initialCat.classList.add('loaded'), { once: true });
            initialCat.addEventListener('error', () => initialCat.classList.add('loaded'), { once: true });
        }
    </script>
</body>
