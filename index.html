<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f0f7ff">
    <title>VapeShop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f0f7ff;
            --bg-card: #ffffff;
            --bg-input: #f7faff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent: #0d6efd;
            --accent-hover: #0b5ed7;
            --accent-light: #e7f1ff;
            --border: #e5ebf5;
            --shadow-card: 0 2px 10px rgba(13, 110, 253, 0.06);
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--accent);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            font-size: 15px;
            line-height: 1.4;
        }

        .app {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .page {
            display: none;
            min-height: 100%;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-body {
            padding: 14px 14px 24px;
        }

        .sub-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 22px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 48px;
            box-shadow: 0 4px 14px rgba(13, 110, 253, 0.06);
        }

        .sub-back-btn {
            position: absolute;
            left: 10px;
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
        }

        .sub-back-btn:active {
            background: var(--accent-light);
        }

        .sub-back-btn svg {
            width: 22px;
            height: 22px;
        }

        .sub-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .favorites-banner {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px 8px 8px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            transition: transform 0.15s ease;
        }

        .favorites-banner:active {
            transform: scale(0.985);
        }

        .favorites-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .favorites-avatar {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .favorites-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .favorites-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: auto;
            margin-right: 8px;
        }

        .favorites-arrow {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px 10px;
        }

        .category-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .category-card:active {
            transform: scale(0.95);
        }

        .category-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .category-placeholder {
            font-size: 38px;
            line-height: 1;
        }

        .category-badge {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(13, 110, 253, 0.3);
        }

        .category-label {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.25;
        }

        .showcase-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .showcase-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .showcase-card {
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .showcase-card:active {
            background: var(--bg-input);
        }

        .showcase-thumb {
            width: 82px;
            height: 82px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            padding: 6px;
        }

        .showcase-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .showcase-thumb-icon {
            font-size: 34px;
        }

        .showcase-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        .showcase-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.2px;
            line-height: 1.2;
        }

        .showcase-desc {
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .showcase-sub {
            font-size: 11.5px;
            color: var(--accent);
            font-weight: 600;
        }

        .fav-pill-btn {
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .fav-pill-btn.active {
            border-color: var(--accent);
            background: var(--accent-light);
            color: var(--accent);
        }

        .fav-pill-btn svg {
            width: 14px;
            height: 14px;
        }

        .circle-arrow-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--bg-input);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.25s ease, background 0.15s ease;
        }

        .circle-arrow-btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.25s ease;
        }

        .circle-arrow-btn.open {
            background: var(--accent-light);
            color: var(--accent);
        }

        .circle-arrow-btn.open svg {
            transform: rotate(90deg);
        }

        .tastes-drawer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: var(--bg-input);
            border-top: 0 solid var(--border);
        }

        .tastes-drawer.open {
            max-height: 900px;
            border-top-width: 1px;
        }

        .tastes-inner {
            padding: 12px;
        }

        .tastes-caption {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .tastes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .taste-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            cursor: pointer;
            text-align: left;
        }

        .taste-chip:active {
            transform: scale(0.97);
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .taste-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.25;
        }

        .taste-action {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .model-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            position: relative;
            cursor: pointer;
            box-shadow: var(--shadow-card);
        }

        .model-card:active {
            transform: scale(0.97);
        }

        .model-fav-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: var(--bg-input);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .model-fav-btn.active {
            background: var(--accent-light);
            color: var(--accent);
        }

        .model-fav-btn svg {
            width: 15px;
            height: 15px;
        }

        .model-image {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            overflow: hidden;
        }

        .model-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .model-name {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.25;
        }

        .model-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            margin-top: auto;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .cart-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: var(--shadow-card);
        }

        .cart-item-info {
            min-width: 0;
            flex: 1;
        }

        .cart-item-title {
            font-size: 14px;
            font-weight: 600;
        }

        .cart-item-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 8px;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .qty-val {
            font-size: 14px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }

        .primary-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary-btn:active {
            background: var(--accent-hover);
        }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }

        .profile-avatar {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .bottom-nav {
            flex-shrink: 0;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            height: calc(68px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            padding: 8px 20px;
            position: relative;
            opacity: 0.78;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .nav-btn.active {
            opacity: 1;
        }

        .nav-btn:active {
            transform: scale(0.92);
        }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
        }

        .nav-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .nav-btn.active .nav-dot {
            opacity: 1;
        }

        .nav-cart-badge {
            position: absolute;
            top: 2px;
            right: 10px;
            min-width: 17px;
            height: 17px;
            padding: 0 5px;
            border-radius: 999px;
            background: #ffffff;
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .nav-cart-badge.visible {
            display: flex;
        }

        .toast {
            position: fixed;
            bottom: 92px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: var(--text-primary);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 1000;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="app">
        <main id="mainScroll">
            <div class="page active" id="homePage">
                <div class="page-body">
                    <div class="favorites-banner" id="openFavoritesBtn">
                        <div class="favorites-left">
                            <div class="favorites-avatar">❤️</div>
                            <span class="favorites-title">Избранное</span>
                        </div>
                        <span class="favorites-meta" id="favCountText"></span>
                        <svg class="favorites-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                        </svg>
                    </div>
                    <div class="category-grid" id="categoryGrid"></div>
                </div>
            </div>

            <div class="page" id="brandPage">
                <div class="sub-header">
                    <button class="sub-back-btn" id="backToHome" aria-label="Назад">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                        </svg>
                    </button>
                    <div class="sub-title" id="brandPageTitle">Вейпы</div>
                </div>
                <div class="page-body">
                    <div class="showcase-list" id="brandList"></div>
                </div>
            </div>

            <div class="page" id="modelsPage">
                <div class="sub-header">
                    <button class="sub-back-btn" id="backToCategory" aria-label="Назад">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                        </svg>
                    </button>
                    <div class="sub-title" id="modelsPageTitle">Модели</div>
                </div>
                <div class="page-body">
                    <div class="models-grid" id="modelsGrid"></div>
                </div>
            </div>

            <div class="page" id="favoritesPage">
                <div class="sub-header">
                    <button class="sub-back-btn" id="backFromFavs" aria-label="Назад">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                        </svg>
                    </button>
                    <div class="sub-title">Избранное</div>
                </div>
                <div class="page-body">
                    <div class="showcase-list" id="favoritesList"></div>
                </div>
            </div>

            <div class="page" id="cartPage">
                <div class="page-body">
                    <h1 class="section-title">Корзина</h1>
                    <div class="cart-list" id="cartList"></div>
                    <div id="cartSummary"></div>
                </div>
            </div>

            <div class="page" id="profilePage">
                <div class="page-body">
                    <h1 class="section-title">Профиль</h1>
                    <div class="profile-card" id="profileCard"></div>
                </div>
            </div>
        </main>
    </div>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="home" aria-label="Главная">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
            </svg>
            <span class="nav-dot"></span>
        </button>

        <button class="nav-btn" data-tab="cart" aria-label="Корзина">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" />
            </svg>
            <span class="nav-cart-badge" id="navCartBadge">0</span>
            <span class="nav-dot"></span>
        </button>

        <button class="nav-btn" data-tab="profile" aria-label="Профиль">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            <span class="nav-dot"></span>
        </button>
    </nav>

    <div class="toast" id="toast">Добавлено в корзину</div>

    <script>
       const categories = [
    { id: 'liquids', name: 'Жижа', icon: '💧', image: 'zhizha.jpg', badge: 'СКИДКИ' },
    { id: 'consumables', name: 'Расходники', icon: '🔧', image: 'rashodniki.jpg', badge: '' },
