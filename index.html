<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>WEGGEW</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-dark: #000000;
            --bg-card: rgba(14, 14, 14, 0.88);
            --bg-card-hover: rgba(24, 24, 24, 0.94);
            --text-white: #ffffff;
            --text-gray: #8a8a8a;
            --accent: #ffffff;
            --border-dark: rgba(255, 255, 255, 0.1);
            --border-card: rgba(255, 255, 255, 0.1);
            --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            --font-main: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        html, body { height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
        body { font-family: var(--font-main); background: var(--bg-dark); color: var(--text-white); display: flex; flex-direction: column; font-size: 15px; line-height: 1.4; }
.smoke-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            height: 100lvh;
            min-height: 100vh;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.4s ease;
        }
        body.subtle-smoke .smoke-canvas {
            opacity: 0.25;
        }
        .smoke-shade {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 25%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.55) 70%, #000 100%);
        }
        .app {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: transparent;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
        .page { display: none; min-height: 100%; flex-direction: column; }
        .page.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* КОТ НА ГЛАВНОЙ */
        .cat-mask {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .cat-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            mix-blend-mode: lighten;
            -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 92%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, #000 92%, transparent 100%);
        }
        .paw-left, .paw-right {
            position: absolute;
            bottom: 8%;
            width: 50px;
            height: 50px;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 40%, transparent 70%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            pointer-events: none;
            opacity: 0;
            animation: pawFadeIn 1.5s ease-out 0.8s forwards, pawSmoke 4s ease-in-out 2.3s infinite;
        }
        .paw-left {
            left: 20%;
            transform: rotate(-15deg);
        }
        .paw-right {
            right: 20%;
            transform: rotate(15deg);
        }
        @keyframes pawFadeIn {
            0% { opacity: 0; transform: translateY(20px) rotate(-15deg) scale(0.8); filter: blur(0); }
            50% { opacity: 0.6; transform: translateY(-10px) rotate(-15deg) scale(1.1); filter: blur(2px); }
            100% { opacity: 0.4; transform: translateY(0) rotate(-15deg) scale(1); filter: blur(4px); }
        }
        @keyframes pawSmoke {
            0% { opacity: 0.4; transform: translateY(0) rotate(-15deg) scale(1); filter: blur(4px); }
            25% { opacity: 0.25; transform: translateY(-15px) rotate(-10deg) scale(1.15); filter: blur(8px); }
            50% { opacity: 0.12; transform: translateY(-30px) rotate(-5deg) scale(1.3); filter: blur(14px); }
            75% { opacity: 0.04; transform: translateY(-45px) rotate(0deg) scale(1.5); filter: blur(20px); }
            100% { opacity: 0; transform: translateY(-60px) rotate(5deg) scale(1.7); filter: blur(28px); }
        }
        .paw-right {
            animation: pawFadeInRight 1.5s ease-out 0.8s forwards, pawSmokeRight 4s ease-in-out 2.5s infinite;
        }
        @keyframes pawFadeInRight {
            0% { opacity: 0; transform: translateY(20px) rotate(15deg) scale(0.8); filter: blur(0); }
            50% { opacity: 0.6; transform: translateY(-10px) rotate(15deg) scale(1.1); filter: blur(2px); }
            100% { opacity: 0.4; transform: translateY(0) rotate(15deg) scale(1); filter: blur(4px); }
        }
        @keyframes pawSmokeRight {
            0% { opacity: 0.4; transform: translateY(0) rotate(15deg) scale(1); filter: blur(4px); }
            25% { opacity: 0.25; transform: translateY(-15px) rotate(10deg) scale(1.15); filter: blur(8px); }
            50% { opacity: 0.12; transform: translateY(-30px) rotate(5deg) scale(1.3); filter: blur(14px); }
            75% { opacity: 0.04; transform: translateY(-45px) rotate(0deg) scale(1.5); filter: blur(20px); }
            100% { opacity: 0; transform: translateY(-60px) rotate(-5deg) scale(1.7); filter: blur(28px); }
        }

        /* ЭКРАН 1: ПРИВЕТСТВИЕ */
        #welcomePage {
            justify-content: space-between;
            align-items: center;
            padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 8px);
            text-align: center;
            position: relative;
            overflow: hidden;
            height: 100%;
            max-height: 100%;
            min-height: 100%;
        }
        .welcome-hero {
            position: relative;
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }
        .phone-mask {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            overflow: hidden;
        }
        .phone {
            position: relative;
            flex-shrink: 0;
            width: 25.5em;
            aspect-ratio: 9 / 19.4;
            margin-top: 0.35em;
            font-size: clamp(6px, min(2.5vw, 1.62vh), 12.5px);
            border: 0.12em solid #333333;
            border-radius: 3.6em;
            background: linear-gradient(150deg, #3a3a3a 0%, #121212 8%, #000 30%, #000 100%);
            box-shadow:
                0 2em 4em rgba(0,0,0,0.9),
                0 0 0 0.12em #050505,
                inset 0 0 0 0.16em #0a0a0a,
                inset 0 0 1.4em rgba(255,255,255,0.08);
            transform: rotate(8deg) translateZ(0);
            transform-origin: 50% 35%;
            color: #ffffff;
        }
        .phone::before,
        .phone::after {
            content: "";
            position: absolute;
            right: -0.2em;
            width: 0.18em;
            border-radius: 0.2em;
            background: linear-gradient(180deg, #2d2d2d, #111111);
        }
        .phone::before { top: 17%; height: 4.6em; }
        .phone::after { top: 31%; height: 8.6em; }
        .phone-left-btn {
            position: absolute;
            left: -0.17em;
            top: 23%;
            width: 0.13em;
            height: 3.2em;
            border-radius: 0.2em;
            background: #222222;
        }
        .phone-left-btn.two { top: 31%; height: 5.2em; }
        .phone-screen {
            position: absolute;
            inset: 0.3em;
            display: flex;
            flex-direction: column;
            padding: 0.75em 1em 0;
            border-radius: 3.35em;
            background: #080808;
            overflow: hidden;
            box-shadow: inset 0 0 1.5em rgba(0,0,0,0.9);
        }
        .phone-screen::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.032), transparent 30%),
                radial-gradient(circle at 80% 45%, rgba(255,255,255,0.026), transparent 35%);
        }
        .tg-island {
            position: absolute;
            top: 0.55em;
            left: 50%;
            transform: translateX(-50%);
            width: 4.6em;
            height: 1.15em;
            border-radius: 1em;
            background: #000000;
            box-shadow: 0 0 0 0.06em rgba(255,255,255,0.05);
            z-index: 3;
        }
        .tg-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.25em 0.65em 0;
            font-size: 0.82em;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .tg-status-icons { display: flex; align-items: center; gap: 0.3em; }
        .tg-status-icons svg { width: 1.25em; height: 1.25em; }
        .tg-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9em 0.4em 0.2em;
            color: #bdbdbd;
            position: relative;
            z-index: 1;
        }
        .tg-back { font-size: 1.9em; line-height: 0.9; font-weight: 300; color: #c9c9c9; }
        .tg-more { font-size: 1.1em; font-weight: 700; letter-spacing: 0.08em; color: #c9c9c9; }
        .tg-avatar {
            width: 7.15em;
            height: 7.15em;
            margin: 0.5em auto 0.1em;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 28%, #7a7a7a 0%, #3a3a3a 42%, #141414 100%);
            border: 0.12em solid rgba(255,255,255,0.08);
            box-shadow: 0 0.5em 1.4em rgba(0,0,0,0.6), inset 0 0.2em 0.8em rgba(255,255,255,0.12);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .tg-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .tg-name {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.25em;
            margin-top: 0.55em;
            font-size: 2.02em;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: 0.01em;
            position: relative;
            z-index: 1;
        }
        .tg-verified {
            width: 1em;
            height: 1em;
            border-radius: 50%;
            background: #2f9cf5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0.08em 0.3em rgba(47,156,245,0.5);
        }
        .tg-verified svg { width: 0.64em; height: 0.64em; display: block; }
        .tg-lastseen { margin-top: 0.55em; text-align: center; font-size: 0.82em; color: #8f8f8f; position: relative; z-index: 1; }
        .tg-actions { display: flex; gap: 0.55em; margin-top: 1.1em; position: relative; z-index: 1; }
        .tg-action {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4em;
            padding: 0.75em 0.15em 0.55em;
            border-radius: 0.85em;
            background: linear-gradient(180deg, #242424, #1a1a1a);
            box-shadow: inset 0 0.06em 0 rgba(255,255,255,0.05);
        }
        .tg-action svg { width: 1.5em; height: 1.5em; stroke: #e8e8e8; fill: none; stroke-width: 1.7; }
        .tg-action span { font-size: 0.68em; color: #d2d2d2; }
        .tg-note { margin-top: 1.1em; text-align: center; font-size: 0.76em; color: #8f8f8f; position: relative; z-index: 1; }
        .tg-note b { color: #bdbdbd; font-weight: 600; }
        .tg-card {
            margin-top: 0.85em;
            background: #222222;
            border-radius: 0.85em;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .tg-row { padding: 0.65em 0.85em 0.7em; border-bottom: 1px solid rgba(255,255,255,0.055); }
        .tg-row:last-child { border-bottom: 0; }
        .tg-label { margin-bottom: 0.18em; font-size: 0.68em; color: #7f7f7f; }
        .tg-value { font-size: 1.05em; font-weight: 500; color: #ededed; }
        .tg-bio { font-size: 0.82em; line-height: 1.3; color: #a8a8a8; font-weight: 400; }
        @media (max-height: 700px) {
            #welcomePage { padding-top: calc(env(safe-area-inset-top, 0px) + 4px); }
            .welcome-title { font-size: clamp(24px, 7.2vw, 32px); }
            .welcome-divider { margin: 8px auto; }
            .welcome-subtitle { margin-bottom: 12px; font-size: 11px; line-height: 1.6; }
            .features-grid { margin-bottom: 12px; }
            .feature-item { gap: 6px; }
            .feature-text { font-size: 8px; }
            .main-btn { padding-top: 13px; padding-bottom: 13px; }
        }
        .welcome-bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: relative;
            z-index: 3;
            margin-top: auto;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.75) 100%);
            padding-top: 8px;
        }
        .welcome-title {
            font-size: clamp(30px, 8.6vw, 42px);
            font-weight: 200;
            letter-spacing: clamp(10px, 3.6vw, 18px);
            text-transform: uppercase;
            color: #ededed;
            line-height: 1;
            padding-left: clamp(10px, 3.6vw, 18px);
            text-shadow: 0 2px 24px rgba(0,0,0,0.65);
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
        }
        .title-char {
            display: inline-block;
            opacity: 0;
            transform: translateY(14px) scale(0.96);
            filter: blur(6px);
            animation: charReveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: calc(var(--i) * 0.5s);
            will-change: opacity, transform, filter;
        }
        @keyframes charReveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        .welcome-divider {
            width: 46px;
            height: 1px;
            background: rgba(255,255,255,0.38);
            margin: clamp(12px, 2vh, 18px) auto;
            position: relative;
            z-index: 1;
            transform: scaleX(0);
            transform-origin: center;
            animation: dividerReveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 3.2s;
            will-change: transform;
        }
        @keyframes dividerReveal {
            to { transform: scaleX(1); }
        }
        .welcome-subtitle {
            font-size: clamp(11px, 3.2vw, 13px);
            font-weight: 300;
            letter-spacing: clamp(3px, 1.25vw, 5px);
            line-height: 1.85;
            color: #cfcfcf;
            text-transform: uppercase;
            margin-bottom: clamp(20px, 3.4vh, 32px);
            position: relative;
            z-index: 1;
        }
        .subtitle-line {
            display: block;
            opacity: 0;
            transform: translateY(10px);
            filter: blur(4px);
            animation: subtitleReveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: opacity, transform, filter;
        }
        .subtitle-line:first-child { animation-delay: 3.3s; }
        .subtitle-line:last-child { animation-delay: 3.5s; }
        @keyframes subtitleReveal {
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .welcome-hint {
            font-size: clamp(11px, 2.8vw, 12px);
            font-weight: 400;
            letter-spacing: clamp(1.5px, 0.5vw, 2px);
            line-height: 1.4;
            color: #cfcfcf;
            text-transform: uppercase;
            margin-bottom: clamp(16px, 2.5vh, 22px);
            position: relative;
            z-index: 1;
            opacity: 0;
            transform: translateY(8px);
            filter: blur(4px);
            animation: hintReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            animation-delay: 3.9s;
            will-change: opacity, transform, filter;
        }
        @keyframes hintReveal {
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .main-btn {
            width: 100%;
            max-width: 100%;
            padding: clamp(16px, 2.6vh, 20px) 24px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-white);
            font-size: clamp(11px, 3.1vw, 13px);
            font-weight: 500;
            letter-spacing: clamp(2px, 0.8vw, 3px);
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            z-index: 1;
            transition: all 0.2s ease;
        }
        .main-btn:active {
            background: var(--accent);
            color: var(--bg-dark);
        }
        /* ЭКРАН 2: ВЫБОР ТОЧКИ */
        #locationPage { padding: 40px 24px; justify-content: center; align-items: center; }
        .location-header { text-align: center; margin-bottom: 30px; width: 100%; }
        .location-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.8; }
        .location-title { font-size: 28px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
        .location-desc { font-size: 13px; color: var(--text-gray); line-height: 1.5; max-width: 300px; margin: 0 auto; }
        .location-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .location-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: background 0.2s, border-color 0.2s; text-align: left; position: relative; z-index: 1; box-shadow: var(--shadow-card); }
        .location-card:active { background: var(--bg-card-hover); }
        .location-card.selected { border-color: var(--text-white); }
        .location-card-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .location-card-content { flex: 1; }
        .location-card-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .location-card-sub { font-size: 12px; color: var(--text-gray); }
        .location-card-arrow { color: var(--text-gray); font-size: 18px; }
        .legal-info { text-align: center; font-size: 11px; color: #555; line-height: 1.6; margin-bottom: 30px; max-width: 320px; position: relative; z-index: 1; }
        .legal-info p { margin-bottom: 6px; }

        /* ЭКРАН 3: КАТАЛОГ */
        #catalogPage { padding: 20px 16px 100px; }
        .catalog-header { margin-bottom: 20px; }
        .catalog-title { font-size: 26px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
        .search-bar { display: flex; align-items: center; gap: 10px; background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 12px 16px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
        .search-bar input { background: transparent; border: none; outline: none; color: var(--text-white); font-size: 14px; width: 100%; font-family: inherit; }
        .search-bar input::placeholder { color: var(--text-gray); }
        .search-bar svg { width: 20px; height: 20px; stroke: var(--text-gray); flex-shrink: 0; }
        .filters-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; margin-bottom: 20px; }
        .filters-row::-webkit-scrollbar { display: none; }
        .filter-chip { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 8px 16px; font-size: 12px; color: var(--text-white); white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 6px; flex-shrink: 0; box-shadow: var(--shadow-card); }
        .filter-chip.active { background: var(--text-white); color: var(--bg-dark); border-color: var(--text-white); }
        .filter-chip .badge-dot { width: 8px; height: 8px; background: var(--text-white); border-radius: 50%; }
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .category-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; cursor: pointer; transition: background 0.2s; text-align: center; position: relative; z-index: 1; box-shadow: var(--shadow-card); }
        .category-card:active { background: var(--bg-card-hover); }
        .category-card-image { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 48px; }
        .category-card-image img { width: 100%; height: 100%; object-fit: contain; }
        .category-card-title { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .category-card-sub { font-size: 12px; color: var(--text-gray); }
        .scroll-hint { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 20px; font-size: 12px; color: var(--text-white); display: flex; align-items: center; gap: 6px; pointer-events: none; animation: fadeInOut 3s infinite; }
        @keyframes fadeInOut { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        /* НИЖНЯЯ НАВИГАЦИЯ */
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-card); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border-card); display: flex; justify-content: space-around; align-items: center; height: calc(68px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); z-index: 100; box-shadow: var(--shadow-card); }
        .nav-btn { position: relative; background: none; border: none; color: var(--text-gray); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 8px 16px; font-family: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s; }
        .nav-btn.active { color: var(--text-white); }

        /* СТРАНИЦА БРЕНДА */
        .sub-header { display: flex; align-items: center; gap: 12px; padding: 16px; margin-bottom: 16px; background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-card); position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow-card); }
        .back-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-white); box-shadow: var(--shadow-card); }

        .product-card { background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 20px; padding: 14px; display: flex; gap: 14px; align-items: center; cursor: pointer; transition: background 0.2s; position: relative; z-index: 1; box-shadow: var(--shadow-card); }
        .product-card:active { background: var(--bg-card-hover); }
        .product-thumb { width: 80px; height: 80px; border-radius: 14px; background: var(--border-card); display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-card); }
        .product-thumb img { width: 100%; height: 100%; object-fit: contain; }
        .product-thumb img.full-cover { object-fit: cover; transform: scale(1.25); }
        .product-info { flex: 1; min-width: 0; }

        .product-desc { font-size: 12px; color: var(--text-gray); margin-bottom: 6px; line-height: 1.3; }
        .product-price { font-size: 16px; font-weight: 700; color: var(--text-white); }
        .product-price span { font-size: 12px; font-weight: 400; color: var(--text-gray); margin-left: 4px; }
        .promo-badge { display: inline-block; background: #ff9800; color: #000; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 8px; text-transform: uppercase; }
        .add-to-cart-btn { margin-left: auto; padding: 8px 14px; background: var(--text-white); color: var(--bg-dark); border: none; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; flex-shrink: 0; transition: background 0.2s, transform 0.1s; }

        /* АККОРДЕОН БРЕНДОВ И РАСЦВЕТОК */

        /* КОРЗИНА И ПРОФИЛЬ */

        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</head>

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" /></svg>

                <span>Профиль</span>

    </div>

    <div class="toast" id="toast">Добавлено</div>

    <script>
        // --- ВАША ССЫЛКА НА CSV ---
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS9xjVn31NafFzNqA_aXeHhSeuvGcRiR3bf1pnfGD4HtEBAMuB6bS6j9ivHrR7zkzhGGtyk_R1PEcOV/pub?gid=0&single=true&output=csv';
        // --- ДАННЫЕ ---
        const categories = [
            { id: 'vapes', name: 'ВЕЙПЫ', sub: '3 бренда', icon: '📱', image: 'vape.png' },
            { id: 'snus', name: 'СНЮС', sub: '4 бренда', icon: '📦', image: 'snus.png' },
            { id: 'liquids', name: 'ЖИДКОСТИ', sub: '29 брендов', icon: '💧', image: 'zhizha.png' },
            { id: 'disposables', name: 'ОДНОРАЗКИ', sub: '12 брендов', icon: '🚬', image: 'odnorazki.png' },
            { id: 'consumables', name: 'РАСХОДНИКИ', sub: '5 брендов', icon: '🔧', image: 'rashodniki.png' }
        ];

        const catalogData = {
            vapes: [],
            snus: [],
            liquids: [],
            disposables: [],
            consumables: []
        };

        let vapeBrands = [];
        let liquidBrands = [];
        let cart = [];
        let currentCategoryId = null;

        const pages = {
            welcome: document.getElementById('welcomePage'),
            catalog: document.getElementById('catalogPage'),
            brand: document.getElementById('brandPage'),
            cart: document.getElementById('cartPage'),
            profile: document.getElementById('profilePage')
        };

        const mainScroll = document.getElementById('mainScroll');
        const bottomNav = document.getElementById('bottomNav');
        const categoryGrid = document.getElementById('categoryGrid');
        const brandList = document.getElementById('brandList');
        const brandPageTitle = document.getElementById('brandPageTitle');
        const toast = document.getElementById('toast');
        const cartCountEl = document.getElementById('cartCount');

        function showPage(name) {
            Object.values(pages).forEach(p => p.classList.remove('active'));
            pages[name].classList.add('active');
            mainScroll.scrollTop = 0;

            if (name === 'welcome') {
                const catImg = document.getElementById('catImage');
                if (catImg) {
                    catImg.classList.remove('loaded');
                    requestAnimationFrame(() => catImg.classList.add('loaded'));
                }
                // Restart entrance animations
                restartWelcomeAnimations();
            }

            // Subtle smoke on location page
            document.body.classList.toggle('subtle-smoke', name === 'location');

            if (name === 'catalog' || name === 'cart' || name === 'profile' || name === 'brand') {
                bottomNav.style.display = 'flex';
            } else {
                bottomNav.style.display = 'none';
            }

            const tabMap = { catalog: 'catalog', brand: 'catalog', cart: 'cart', profile: 'profile' };
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === (tabMap[name] || ''));
            });
        }

        function restartWelcomeAnimations() {
            const titleChars = document.querySelectorAll('.title-char');
            const divider = document.querySelector('.welcome-divider');
            const subtitleLines = document.querySelectorAll('.subtitle-line');
            const hint = document.querySelector('.welcome-hint');

            [divider, hint, ...subtitleLines, ...titleChars].forEach(el => {
                if (el) {
                    el.style.animation = 'none';
                    el.offsetHeight; // force reflow
                    el.style.animation = '';
                }
            });
        }

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // --- ПАРСИНГ CSV ---
        function parseCSV(text) {
            const rows = [];
            let row = [], cell = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i], next = text[i + 1];
                if (ch === '"' && inQuotes && next === '"') { cell += '"'; i++; }
                else if (ch === '"') { inQuotes = !inQuotes; }
                else if (ch === ',' && !inQuotes) { row.push(cell.trim()); cell = ''; }
                else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                    if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); row = []; cell = ''; }
                } else { cell += ch; }
            }
            if (cell.length || row.length) { row.push(cell.trim()); rows.push(row); }
            return rows;
        }

        // --- СИНХРОНИЗАЦИЯ С ТАБЛИЦЕЙ ---
        async function syncWithSheet() {
            try {
                const res = await fetch(`${SHEET_CSV_URL}&t=${Date.now()}`);
                const csvText = await res.text();
                const rows = parseCSV(csvText);
                
                if (rows.length < 2) return;

                const headers = rows[0].map(h => h.toLowerCase().trim());
                const idxCat = headers.indexOf('category');
                const idxBrand = headers.indexOf('brand');
                const idxName = headers.indexOf('name');
                const idxDesc = headers.indexOf('desc');
                const idxPrice = headers.indexOf('price');
                const idxStock = headers.indexOf('stock');
                const idxColors = headers.indexOf('colors');
                const idxImage = headers.indexOf('image');

                if (idxName === -1 || idxPrice === -1) {
                    console.warn('В таблице не найдены столбцы name или price');
                    return;
                }

                const catMapping = {
                    'devices': 'vapes',
                    'consumables': 'consumables',
                    'snus': 'snus',
                    'liquids': 'liquids',
                    'disposables': 'disposables'
                };

                const defaultImages = {
                    vapes: 'vape.png',
                    snus: 'snus.png',
                    liquids: 'zhizha.png',
                    disposables: 'odnorazki.png',
                    consumables: 'rashodniki.png'
                };

                const newVapeData = [];
                const newLiquidData = [];
                const newData = {
                    vapes: [],
                    snus: [],
                    liquids: [],
                    disposables: [],
                    consumables: []
                };

                for (let i = 1; i < rows.length; i++) {
                    const r = rows[i];
                    if (!r[idxName] || r[idxName].trim() === '') continue;

                    const rawCat = idxCat !== -1 ? r[idxCat].trim() : '';
                    const siteCat = catMapping[rawCat] || rawCat; 
                    
                    const name = r[idxName].trim();
                    const price = Number(r[idxPrice]) || 0;
                    const stock = idxStock !== -1 ? (Number(r[idxStock]) || 0) : 99;
                    const brand = idxBrand !== -1 ? r[idxBrand].trim() : '';
                    const desc = idxDesc !== -1 ? r[idxDesc].trim() : '';
                    const colorsStr = idxColors !== -1 ? r[idxColors].trim() : '';
                    const image = idxImage !== -1 ? r[idxImage].trim() : '';

                    if (stock <= 0) continue;

                    const colors = colorsStr ? colorsStr.split(',').map(c => c.trim()).filter(Boolean) : [];
                    const img = image || defaultImages[siteCat] || 'vape.png';
                    const isCover = name.toLowerCase() === 'xros 6 mini';

                    const item = {
                        id: `auto_${i}`,
                        name: name,
                        desc: desc,
                        price: price,
                        image: img,
                        isCover: isCover
                    };

                    if (siteCat === 'vapes' && brand) {
                        newVapeData.push({ ...item, brand, colors });
                    } else if (siteCat === 'liquids' && brand) {
                        newLiquidData.push({ ...item, brand });
                    } else if (newData[siteCat]) {
                        const iconMap = { vapes: '📱', snus: '📦', liquids: '💧', disposables: '🚬', consumables: '🔧' };
                        newData[siteCat].push({ ...item, icon: iconMap[siteCat] || '📦' });
                    }
                }

                // Build vapeBrands grouped by brand
                const vapeBrandMap = new Map();
                for (const item of newVapeData) {
                    if (!vapeBrandMap.has(item.brand)) {
                        vapeBrandMap.set(item.brand, { brand: item.brand, models: [] });
                    }
                    vapeBrandMap.get(item.brand).models.push({
                        name: item.name,
                        desc: item.desc || 'Под-система',
                        price: item.price,
                        image: item.image,
                        isCover: item.isCover,
                        colors: item.colors.length > 0 ? item.colors : ['Чёрный']
                    });
                }
                vapeBrands = Array.from(vapeBrandMap.values());

                // Build liquidBrands grouped by brand
                const liquidBrandMap = new Map();
                for (const item of newLiquidData) {
                    if (!liquidBrandMap.has(item.brand)) {
                        liquidBrandMap.set(item.brand, { brand: item.brand, flavors: [] });
                    }
                    liquidBrandMap.get(item.brand).flavors.push({
                        name: item.name,
                        desc: item.desc || '',
                        price: item.price
                    });
                }
                liquidBrands = Array.from(liquidBrandMap.values());

                // Update other categories
                Object.keys(newData).forEach(key => {
                    if (newData[key].length > 0) {
                        catalogData[key] = newData[key];
                    }
                });

                // Update categories array with actual counts
                categories[0].sub = `${vapeBrands.length} бренд${vapeBrands.length === 1 ? '' : vapeBrands.length < 5 ? 'а' : 'ов'}`;
                categories[2].sub = `${liquidBrands.length} бренд${liquidBrands.length === 1 ? '' : liquidBrands.length < 5 ? 'а' : 'ов'}`;
                categories[1].sub = `${catalogData.snus.length} товар${catalogData.snus.length === 1 ? '' : catalogData.snus.length < 5 ? 'а' : 'ов'}`;
                categories[3].sub = `${catalogData.disposables.length} товар${catalogData.disposables.length === 1 ? '' : catalogData.disposables.length < 5 ? 'а' : 'ов'}`;
                categories[4].sub = `${catalogData.consumables.length} товар${catalogData.consumables.length === 1 ? '' : catalogData.consumables.length < 5 ? 'а' : 'ов'}`;

                console.log('Данные синхронизированы:', { vapeBrands: vapeBrands.length, liquidBrands: liquidBrands.length, ...Object.fromEntries(Object.entries(catalogData).map(([k,v]) => [k, v.length])) });
                
                // Re-render categories if on catalog page
                renderCategories();
                
                // Update open category page if user is inside it
                if (currentCategoryId && pages.brand.classList.contains('active')) {
                    openCategory(currentCategoryId);
                }
            } catch (err) {
                console.error('Ошибка загрузки таблицы:', err);
            }
        }

        function renderCategories() {
            categoryGrid.innerHTML = categories.map(cat => {
                let count = 0;
                if (cat.id === 'vapes') count = vapeBrands.length;
                else if (cat.id === 'liquids') count = liquidBrands.length;
                else count = catalogData[cat.id]?.length || 0;
                return `
                <div class="category-card" data-category="${cat.id}">
                    <div class="category-card-image">
                        ${cat.image ? `<img src="${cat.image}" alt="${cat.name}">` : `<span>${cat.icon}</span>`}
                    </div>
                    <div class="category-card-title">${cat.name}</div>
                    <div class="category-card-sub">${(cat.id === 'vapes' || cat.id === 'liquids') ? `${count} бренд${count === 1 ? '' : count < 5 ? 'а' : 'ов'}` : `${count} шт.`}</div>
                </div>
            `}).join('');

            categoryGrid.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', () => openCategory(card.dataset.category));
            });
        }

        function openCategory(categoryId) {
            currentCategoryId = categoryId;
            const category = categories.find(c => c.id === categoryId);
            brandPageTitle.textContent = category.name;

            if (categoryId === 'vapes') {
                brandList.innerHTML = vapeBrands.map((b, bIdx) => `
                    <div class="brand-group">
                        <div class="brand-group-card" data-brand-idx="${bIdx}">
                            <div class="brand-group-title">${b.brand}</div>
                            <div class="brand-group-arrow">›</div>
                        </div>
                        <div class="brand-models-list" id="brandModels_${bIdx}">
                            ${b.models.map((m, mIdx) => `
                                <div class="product-card" data-model-target="colors_${bIdx}_${mIdx}">
                                    <div class="product-thumb">
                                        <img src="${m.image}" class="${m.isCover ? 'full-cover' : ''}" alt="${m.name}">
                                    </div>
                                    <div class="product-info">
                                        <div class="product-title">${m.name} <span class="promo-badge">🤑 скидка на жидкость</span></div>
                                        <div class="product-desc">${m.desc}</div>
                                        <div class="product-price">${m.price} BYN</div>
                                    </div>
                                </div>
                                <div class="model-colors-list" id="colors_${bIdx}_${mIdx}">
                                    ${m.colors.map(c => `<div class="color-chip">${c}</div>`).join('')}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');

                brandList.querySelectorAll('.brand-group-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const idx = card.dataset.brandIdx;
                        card.classList.toggle('open');
                        document.getElementById(`brandModels_${idx}`).classList.toggle('open');
                    });
                });

                brandList.querySelectorAll('.product-card[data-model-target]').forEach(card => {
                    card.addEventListener('click', () => {
                        const targetId = card.dataset.modelTarget;
                        document.getElementById(targetId).classList.toggle('open');
                    });
                });

                showPage('brand');
                return;
            }
            if (categoryId === 'liquids') {
                brandList.innerHTML = liquidBrands.map((b, bIdx) => `
                    <div class="brand-group">
                        <div class="brand-group-card" data-brand-idx="${bIdx}">
                            <div class="brand-group-title">${b.brand}</div>
                            <div class="brand-group-arrow">›</div>
                        </div>
                        <div class="brand-models-list" id="liquidFlavors_${bIdx}">
                            ${b.flavors.map(f => `
                                <div class="product-card" data-liquid="${JSON.stringify(f).replace(/"/g, '"')}">
                                    <div class="product-info">
                                        <div class="product-title">${f.name}</div>
                                        <div class="product-desc">${f.desc || ''}</div>
                                        <div class="product-price">${f.price} BYN</div>
                                    </div>
                                    <button class="add-to-cart-btn" data-product="${JSON.stringify(f).replace(/"/g, '&quot;')}">+ В корзину</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');

                brandList.querySelectorAll('.brand-group-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const idx = card.dataset.brandIdx;
                        card.classList.toggle('open');
                        document.getElementById(`liquidFlavors_${idx}`).classList.toggle('open');
                    });
                });

                showPage('brand');
                return;
            }
            
            const entries = catalogData[categoryId] || [];

            if (entries.length === 0) {
                brandList.innerHTML = `<div class="empty-state">В этой категории пока нет товаров в наличии</div>`;
            } else {
                brandList.innerHTML = entries.map(entry => `
                    <div class="product-card" data-entry-id="${entry.id}">
                        <div class="product-thumb">
                            ${entry.image ? `<img src="${entry.image}" class="${entry.isCover ? 'full-cover' : ''}" alt="${entry.name}">` : `<span>${entry.icon}</span>`}
                        </div>
                        <div class="product-info">
                            <div class="product-title">${entry.name}</div>
                            <div class="product-desc">${entry.desc || ''}</div>
                            <div class="product-price">${entry.price} BYN</div>
                        </div>
                        <button class="add-to-cart-btn" data-product="${JSON.stringify(entry).replace(/"/g, '&quot;')}">+ В корзину</button>
                    </div>
                `).join('');
            }

            showPage('brand');
        }

        // --- КОРЗИНА ---
        function addToCart(product) {
            const existing = cart.find(item => item.name === product.name && item.color === product.color);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    id: product.id || 'item_' + Date.now(),
                    name: product.name,
                    desc: product.desc || '',
                    price: product.price,
                    qty: 1,
                    color: product.color || null
                });
            }
            updateCartCount();
            showToast('Добавлено в корзину');
        }

        function updateCartCount() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            if (cartCountEl) {
                cartCountEl.textContent = total;
                cartCountEl.style.display = total > 0 ? 'flex' : 'none';
            }
        }

        function renderCart() {
            const cartPage = document.getElementById('cartPage');
            if (cart.length === 0) {
                cartPage.innerHTML = `
                    <h1 class="section-title">КОРЗИНА</h1>
                    <div class="empty-state">Корзина пока пуста</div>
                `;
                return;
            }
            let total = 0;
            cartPage.innerHTML = `
                <h1 class="section-title">КОРЗИНА</h1>
                <div class="cart-list" style="display:flex; flex-direction:column; gap:12px; padding:0 16px 100px;">
                    ${cart.map(item => {
                        total += item.price * item.qty;
                        return `
                        <div class="cart-item" style="background:var(--bg-card); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--border-card); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-card);">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <div style="flex:1; min-width:0;">
                                    <div style="font-size:15px; font-weight:700; text-transform:uppercase;">${item.name}</div>
                                    ${item.color ? `<div style="font-size:12px; color:var(--text-gray); margin-top:2px;">Цвет: ${item.color}</div>` : ''}
                                    ${item.desc ? `<div style="font-size:12px; color:var(--text-gray); margin-top:2px;">${item.desc}</div>` : ''}
                                </div>
                                <div style="font-size:16px; font-weight:700; white-space:nowrap;">${item.price * item.qty} BYN</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:8px; border-top:1px solid var(--border-card); padding-top:10px;">
                                <button class="qty-btn" data-id="${item.id}" data-action="decrease" style="width:36px; height:36px; border-radius:50%; background:var(--bg-dark); border:1px solid var(--border-card); color:var(--text-white); font-size:18px; display:flex; align-items:center; justify-content:center;">−</button>
                                <span class="qty-value" style="min-width:24px; text-align:center; font-size:15px; font-weight:600;">${item.qty}</span>
                                <button class="qty-btn" data-id="${item.id}" data-action="increase" style="width:36px; height:36px; border-radius:50%; background:var(--bg-dark); border:1px solid var(--border-card); color:var(--text-white); font-size:18px; display:flex; align-items:center; justify-content:center;">+</button>
                                <button class="remove-btn" data-id="${item.id}" style="margin-left:auto; padding:6px 12px; background:transparent; border:1px solid var(--border-card); border-radius:12px; color:var(--text-gray); font-size:11px; text-transform:uppercase; letter-spacing:0.5px;">Удалить</button>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
                <div style="position:fixed; bottom:calc(68px + env(safe-area-inset-bottom)); left:0; right:0; background:var(--bg-card); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border-card); padding:16px; display:flex; flex-direction:column; gap:12px; z-index:100; box-shadow:var(--shadow-card);">
                    <div style="display:flex; justify-content:space-between; font-size:16px; font-weight:700;">
                        <span>Итого</span>
                        <span id="cartTotal">${total} BYN</span>
                    </div>
                    <button class="checkout-btn" id="checkoutBtn" style="width:100%; padding:16px 24px; border:none; border-radius:16px; background:var(--text-white); color:var(--bg-dark); font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:1px; cursor:pointer;">ОФОРМИТЬ ЗАКАЗ</button>
                </div>
            `;

            // Event listeners for cart items
            cartPage.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const action = btn.dataset.action;
                    const item = cart.find(i => i.id === id);
                    if (item) {
                        if (action === 'increase') item.qty += 1;
                        else if (action === 'decrease') {
                            item.qty -= 1;
                            if (item.qty <= 0) {
                                const idx = cart.indexOf(item);
                                cart.splice(idx, 1);
                            }
                        }
                        renderCart();
                        updateCartCount();
                    }
                });
            });

            cartPage.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const idx = cart.findIndex(i => i.id === id);
                    if (idx !== -1) {
                        cart.splice(idx, 1);
                        renderCart();
                        updateCartCount();
                    }
                });
            });

            document.getElementById('checkoutBtn').addEventListener('click', checkout);
        }

        function checkout() {
            if (cart.length === 0) {
                showToast('Корзина пуста');
                return;
            }
            showDeliveryModal();
        }

        function showDeliveryModal() {
            const modal = document.createElement('div');
            modal.className = 'delivery-modal';
            modal.style.cssText = `
                position: fixed; inset: 0; z-index: 1000;
                background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
                display: flex; align-items: center; justify-content: center;
                padding: 20px; animation: fadeIn 0.2s ease;
            `;
            modal.innerHTML = `
                <div style="
                    background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                    border: 1px solid var(--border-card);
                    border-radius: 20px; padding: 24px; width: 100%; max-width: 360px;
                    animation: slideUp 0.3s cubic-bezier(0.22, 1, 0.36, 1);
                    box-shadow: var(--shadow-card);
                ">
                    <h3 style="font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: center;">ВРЕМЯ ПОЛУЧЕНИЯ</h3>
                    <p style="font-size: 13px; color: var(--text-gray); text-align: center; margin-bottom: 20px;">Когда вам удобно забрать заказ?</p>
                    <div class="delivery-options" style="display: flex; flex-direction: column; gap: 10px;">
                        <button class="delivery-option" data-day="today" style="
                            padding: 16px; border-radius: 14px; border: 1px solid var(--border-card);
                            background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                            color: var(--text-white); font-size: 15px; font-weight: 600;
                            text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
                            display: flex; align-items: center; justify-content: center; gap: 10px;
                            transition: background 0.2s, border-color 0.2s;
                            box-shadow: var(--shadow-card);
                        ">📍 Сегодня</button>
                        <button class="delivery-option" data-day="tomorrow" style="
                            padding: 16px; border-radius: 14px; border: 1px solid var(--border-card);
                            background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                            color: var(--text-white); font-size: 15px; font-weight: 600;
                            text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
                            display: flex; align-items: center; justify-content: center; gap: 10px;
                            transition: background 0.2s, border-color 0.2s;
                            box-shadow: var(--shadow-card);
                        ">📅 Завтра</button>
                    </div>
                    <div class="time-picker" style="display: none; margin-top: 16px;">
                        <label style="font-size: 12px; color: var(--text-gray); margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px;">Выберите время</label>
                        <select id="deliveryTime" style="
                            width: 100%; padding: 14px 16px; border-radius: 12px;
                            background: var(--bg-card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                            border: 1px solid var(--border-card);
                            color: var(--text-white); font-size: 14px; font-family: inherit;
                            box-shadow: var(--shadow-card);
                        "></select>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            let selectedDay = 'Сегодня';
            const timeSelect = modal.querySelector('#deliveryTime');
            const timeOptions = ['10:00', '12:00', '15:00', '17:00', '19:00', '21:00'];
            
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = 'Выберите время...';
            defaultOpt.disabled = true;
            defaultOpt.selected = true;
            timeSelect.appendChild(defaultOpt);

            timeOptions.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                timeSelect.appendChild(opt);
            });

            modal.querySelectorAll('.delivery-option').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectedDay = btn.dataset.day === 'today' ? 'Сегодня' : 'Завтра';
                    modal.querySelector('.delivery-options').style.display = 'none';
                    modal.querySelector('.time-picker').style.display = 'block';
                    modal.querySelector('h3').textContent = selectedDay === 'Сегодня' ? 'ВРЕМЯ НА СЕГОДНЯ' : 'ВРЕМЯ НА ЗАВТРА';
                });
            });

            timeSelect.addEventListener('change', (e) => {
                if (!e.target.value) return;
                sendOrder(selectedDay, e.target.value);
                modal.remove();
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.remove();
            });
        }

        function sendOrder(dayLabel, timeLabel) {
            let orderText = 'Здравствуйте! Хочу оформить заказ:\n';
            let total = 0;
            cart.forEach((item, i) => {
                const lineTotal = item.price * item.qty;
                total += lineTotal;
                const colorStr = item.color ? ` (${item.color})` : '';
                orderText += `${i + 1}. ${item.name}${colorStr} × ${item.qty} — ${lineTotal} BYN\n`;
            });
            orderText += `\nИтого: ${total} BYN`;
            orderText += `\n📅 Получение: ${dayLabel}`;
            orderText += `\n⏰ Время: ${timeLabel}`;
            const url = 'https://t.me/Seregablatnou?text=' + encodeURIComponent(orderText);
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                window.Telegram.WebApp.openTelegramLink(url);
            } else {
                window.open(url, '_blank');
            }
            cart = [];
            updateCartCount();
            renderCart();
            showToast('Заказ сформирован');
        }

        // --- ОБРАБОТЧИКИ ---
        document.getElementById('goToCatalogBtn').addEventListener('click', () => {
            // Данные уже загружены при старте, просто переходим в каталог
            renderCategories();
            showPage('catalog');
        });

        document.getElementById('backToCatalog').addEventListener('click', () => showPage('catalog'));

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                if (tab === 'home') showPage('welcome');
                if (tab === 'catalog') showPage('catalog');
                if (tab === 'cart') { showPage('cart'); renderCart(); }
                if (tab === 'profile') showPage('profile');
            });
        });

        // Delegated add-to-cart for dynamically rendered buttons
        document.getElementById('brandList').addEventListener('click', (e) => {
            // Add-to-cart buttons
            const btn = e.target.closest('.add-to-cart-btn');
            if (btn && btn.dataset.product) {
                try {
                    const product = JSON.parse(btn.dataset.product);
                    addToCart(product);
                } catch (err) {
                    console.error('Add to cart parse error:', err);
                }
                return;
            }
            // Color chips for vapes
            const chip = e.target.closest('.color-chip');
            if (chip) {
                e.stopPropagation();
                const color = chip.textContent.trim();
                const productCard = chip.closest('.model-colors-list')?.previousElementSibling;
                const titleEl = productCard?.querySelector('.product-title');
                const priceEl = productCard?.querySelector('.product-price');
                const name = titleEl ? titleEl.textContent.replace('🤑 скидка на жидкость', '').trim() : '';
                const price = priceEl ? parseInt(priceEl.textContent) : 0;
                if (name && price) {
                    addToCart({ name, price, color, desc: `Вейп: ${name}, цвет: ${color}` });
                }
            }
        });

        // --- АНИМИРОВАННЫЙ ДЫМ (canvas) ---
        (function initSmoke() {
            const canvas = document.getElementById('smokeCanvas');
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext('2d');
            let width = 0, height = 0, dpr = 1;
            let puffs = [];

            // Мягкая «клякса» дыма — offscreen canvas
            const puff = document.createElement('canvas');
            puff.width = puff.height = 256;
            const pctx = puff.getContext('2d');
            const grad = pctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, 'rgba(230,235,240,0.8)');
            grad.addColorStop(0.3, 'rgba(200,210,220,0.4)');
            grad.addColorStop(0.6, 'rgba(170,185,200,0.18)');
            grad.addColorStop(0.85, 'rgba(150,170,185,0.06)');
            grad.addColorStop(1, 'rgba(160,170,180,0)');
            pctx.fillStyle = grad;
            pctx.fillRect(0, 0, 256, 256);

            function getViewportHeight() {
                const vv = window.visualViewport;
                if (vv && vv.height) return vv.height;
                return Math.max(window.innerHeight, document.documentElement.clientHeight, document.body.clientHeight);
            }

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 1.75);
                width = window.innerWidth;
                height = getViewportHeight();
                const rect = canvas.getBoundingClientRect();
                canvas.width = Math.max(1, Math.round(rect.width * dpr));
                canvas.height = Math.max(1, Math.round(rect.height * dpr));
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            function createPuffs() {
                const isMobile = width < 480;
                const baseCount = isMobile ? 28 : 42;
                const extraLarge = isMobile ? 6 : 10;
                puffs = [];
                for (let i = 0; i < baseCount; i++) {
                    const r = 65 + Math.random() * 150;
                    puffs.push({
                        x: Math.random() * width,
                        y: height + r + Math.random() * height * 0.8,
                        r,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: -0.5 - Math.random() * 0.6,
                        rot: (Math.random() - 0.5) * 1.8,
                        vr: (Math.random() - 0.5) * 0.001,
                        alpha: 0.18 + Math.random() * 0.14,
                        phase: Math.random() * Math.PI * 2,
                        stretch: 1.3 + Math.random() * 1.0
                    });
                }
                for (let i = 0; i < extraLarge; i++) {
                    const r = 170 + Math.random() * 130;
                    puffs.push({
                        x: Math.random() * width,
                        y: height + r + Math.random() * height * 0.5,
                        r,
                        vx: (Math.random() - 0.5) * 0.1,
                        vy: -0.3 - Math.random() * 0.4,
                        rot: (Math.random() - 0.5) * 1.0,
                        vr: (Math.random() - 0.5) * 0.0005,
                        alpha: 0.12 + Math.random() * 0.10,
                        phase: Math.random() * Math.PI * 2,
                        stretch: 1.1 + Math.random() * 0.7
                    });
                }
            }

            let rafId = 0;

            function draw(time) {
                ctx.clearRect(0, 0, width, height);
                ctx.globalCompositeOperation = 'lighter';
                for (const p of puffs) {
                    p.x += p.vx + Math.sin(time / 3200 + p.phase) * 0.22;
                    p.y += p.vy;
                    p.rot += p.vr;
                    if (p.y + p.r * p.stretch < 0) {
                        p.y = height + p.r + Math.random() * height * 0.3;
                        p.x = Math.random() * width;
                    }
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.globalAlpha = p.alpha;
                    ctx.drawImage(puff, -p.r, -p.r * p.stretch, p.r * 2, p.r * 2 * p.stretch);
                    ctx.restore();
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                rafId = requestAnimationFrame(draw);
            }

            function scheduleResize() {
                resize();
                createPuffs();
                if (!rafId) rafId = requestAnimationFrame(draw);
            }

            resize();
            createPuffs();

            window.addEventListener('resize', scheduleResize);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', scheduleResize);
            }
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    window.Telegram.WebApp.onEvent('viewportChanged', scheduleResize);
                } catch (e) {}
            }

            rafId = requestAnimationFrame(draw);
        })();

        // --- ИНИЦИАЛИЗАЦИЯ ---
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#000000');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        }

        // Загружаем данные из таблицы сразу при старте
        syncWithSheet();
        
        // Автообновление каждые 30 секунд
        setInterval(syncWithSheet, 30000);
    </script>
</body>
</html>
